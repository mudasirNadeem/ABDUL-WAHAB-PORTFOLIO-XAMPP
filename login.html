<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Admin access for the Abdul Wahab portfolio.">
  <title>Admin Access | Abdul Wahab</title>
  <link rel="icon" href="assets/images/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="ambient ambient-c" aria-hidden="true"></div>
  <div class="grid-noise" aria-hidden="true"></div>

  <main class="login-wrap">
    <section class="login-card" id="loginCard">
      <div class="login-mark" aria-hidden="true">AW<i>.</i></div>

      <p class="eyebrow">Restricted area</p>
      <h1>Admin <em>Access</em></h1>
      <p class="login-sub">Sign in to view portfolio submissions.</p>

      <div class="form-error" id="loginError" role="alert" aria-live="assertive">
        <b aria-hidden="true">!</b><span id="loginErrorText">Invalid email or password.</span>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="username"
                 placeholder="you@example.com" required autofocus spellcheck="false">
        </div>

        <div class="field has-toggle">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="Enter your password" required>
          <button type="button" class="pw-toggle" id="pwToggle"
                  aria-label="Show password" aria-pressed="false" title="Show password">&#128065;</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-foot">
        <a class="back-link" href="/"><span aria-hidden="true">&#8592;</span> Back to portfolio</a>
        <small>Secure session</small>
      </div>
    </section>
  </main>

  <script>
  (function () {
    'use strict';

    var form      = document.getElementById('loginForm');
    var card      = document.getElementById('loginCard');
    var emailIn   = document.getElementById('email');
    var passIn    = document.getElementById('password');
    var submitBtn = document.getElementById('submitBtn');
    var errorBox  = document.getElementById('loginError');
    var errorText = document.getElementById('loginErrorText');
    var pwToggle  = document.getElementById('pwToggle');
    var busy      = false;

    /* Escape any string before it touches the DOM. */
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showError(msg) {
      errorText.innerHTML = escapeHtml(msg || 'Invalid email or password.');
      errorBox.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }

    function clearError() {
      errorBox.classList.remove('show');
    }

    function setBusy(state) {
      busy = state;
      submitBtn.classList.toggle('loading', state);
      submitBtn.disabled = state;
      emailIn.disabled = state;
      passIn.disabled = state;
    }

    /* Show / hide password */
    pwToggle.addEventListener('click', function () {
      var showing = passIn.type === 'password';
      passIn.type = showing ? 'text' : 'password';
      pwToggle.setAttribute('aria-pressed', showing ? 'true' : 'false');
      pwToggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      pwToggle.title = showing ? 'Hide password' : 'Show password';
      pwToggle.innerHTML = showing ? '&#128584;' : '&#128065;';
      passIn.focus();
    });

    emailIn.addEventListener('input', clearError);
    passIn.addEventListener('input', clearError);

    /* Already signed in? Go straight to the dashboard. */
    fetch('/api/auth/me', {
      method: 'GET',
      credentials: 'same-origin',
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      if (res.ok) {
        return res.json().then(function (data) {
          if (data && data.success) window.location.replace('/admin');
        });
      }
    }).catch(function () { /* offline / not logged in - stay on the form */ });

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (busy) return;

      var email = emailIn.value.trim();
      var password = passIn.value;

      if (!email || !password) {
        showError('Please enter both your email and password.');
        (email ? passIn : emailIn).focus();
        return;
      }

      clearError();
      setBusy(true);

      fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (res) {
          return res.json()
            .catch(function () { return { success: false }; })
            .then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (result) {
          if (result.ok && result.data && result.data.success) {
            submitBtn.classList.remove('loading');
            submitBtn.querySelector('.btn-label').textContent = 'Signed in';
            window.location.replace('/admin');
            return;
          }
          setBusy(false);
          var msg = (result.data && result.data.message) ? result.data.message : 'Invalid email or password.';
          showError(msg);
          passIn.value = '';
          passIn.focus();
        })
        .catch(function () {
          setBusy(false);
          showError('Could not reach the server. Please try again.');
        });
    });
  })();
  </script>
</body>
</html>
